[project]
name = "motion-analysis-2d"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "camera-calibration",
    "opencv-contrib-python-headless>=5.0.0.93",
    "platformdirs>=4.11.0",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
    "qtawesome>=1.4.2",
    "qtpy>=2.4.3",
    "scipy>=1.18.0",
    "superqt>=0.8.2",
]

[tool.uv.workspace]
members = [
    "deps/camera-calibration",
]

[tool.uv.sources]
camera-calibration = { workspace = true, editable = true }
